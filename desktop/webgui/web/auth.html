<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- 与 Go 端响应头 CSP 等价：不给自己留内联脚本/样式，避免两套策略不一致 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'" />
<title>访问设置 · ZViewer 网页控制台</title>
<link rel="stylesheet" href="/tokens.css" />
<link rel="stylesheet" href="/web/web.css" />
</head>
<body data-page="auth">
<main class="auth-shell">
  <section class="auth-card auth-card-wide">
    <div class="auth-topbar">
      <div class="auth-brand">
        <img class="auth-logo" src="/app-icon.png" alt="" width="36" height="36" />
        <div><h1>ZViewer</h1><p class="auth-kicker">网页控制台 · 访问设置</p></div>
      </div>
      <button type="button" class="auth-theme" id="theme-toggle" aria-label="切换深色/浅色主题" title="切换主题">◐</button>
    </div>
    <p class="auth-sub">控制台使用 ZViewer 超级管理员账号登录，密码在 ZViewer 后台修改。</p>

    <section class="auth-section">
      <h2 class="auth-title">访问地址</h2>
      <ul class="auth-urls" id="access-urls"><li class="auth-note">正在读取当前监听信息…</li></ul>
      <dl class="auth-meta">
        <div><dt>监听地址</dt><dd id="access-bind">—</dd></div>
        <div><dt>端口</dt><dd id="access-port">—</dd></div>
        <div><dt>登录账号</dt><dd id="access-account">—</dd></div>
        <div><dt>账号来源</dt><dd id="access-database">—</dd></div>
      </dl>
      <p class="auth-note">要修改密码，请登录 ZViewer 后台：右上角头像 → 个人设置 → 修改密码。</p>
    </section>

    <div class="auth-actions">
      <a class="auth-secondary" href="/">返回控制台</a>
      <button type="button" class="auth-secondary" id="logout">退出登录</button>
    </div>
  </section>
</main>
<script src="/web/web.js" defer></script>
</body>
</html>

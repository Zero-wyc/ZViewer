services:
  zviewer:
    build:
      context: .
      dockerfile: Dockerfile.linux-single
    ports:
      - "3333:3333"     # 统一端口：后端 API + WebSocket + 前端静态文件 + /live HTTP-FLV 代理
      - "3333:3333/udp" # LiveKit WebRTC 媒体传输（与页面 HTTP 同号，协议不同）
      - "3334:3334"     # RTMP 推流 (OBS)
      - "5349:5349"     # TURN/TLS 媒体中继（TCP，UDP 被拦时的兜底通道；未启用时无害）
    environment:
      # 语音聊天（LiveKit）：LiveKit 已内嵌进本镜像（启动时由后端自动拉起，
      # HTTP/信令经 3333 的 /rtc 反代，媒体走 3333/udp），无需独立容器。
      # 客户端信令地址按请求头自动推导（跟随页面域名与协议，HTTPS 页面自动
      # wss），无需在此配置。
      #
      # 重要：Docker bridge 下容器内探测到的是内网 IP（172.x），浏览器不可达。
      # LIVEKIT_NODE_IP 留空时启动会自动探测宿主公网 IP（依次请求 ipify/
      # ifconfig.me/ip.sb，需容器可出网）；NAT/复杂网络或探测失败时手动指定
      # 为宿主公网 IP，否则信令能通但媒体连不上。
      - LIVEKIT_NODE_IP=${LIVEKIT_NODE_IP:-}
      # 可选：TURN/TLS 媒体中继（TCP 5349）——UDP 直连不通时的兜底通道。
      # 地址用域名（DNS 解析），无需公网 IP；三个变量齐全即自动启用。
      # 注意必须用正式证书（Let's Encrypt 等，自签不被浏览器 WebRTC 信任），
      # 域名需与证书一致。挂载证书目录示例：
      #   volumes 追加: - /etc/letsencrypt:/app/cert:ro
      #   - LIVEKIT_TURN_DOMAIN=zviewer.example.com
      #   - LIVEKIT_TURN_CERT=/app/cert/live/zviewer.example.com/fullchain.pem
      #   - LIVEKIT_TURN_KEY=/app/cert/live/zviewer.example.com/privkey.pem
      - LIVEKIT_TURN_DOMAIN=${LIVEKIT_TURN_DOMAIN:-}
      - LIVEKIT_TURN_CERT=${LIVEKIT_TURN_CERT:-}
      - LIVEKIT_TURN_KEY=${LIVEKIT_TURN_KEY:-}
      - LIVEKIT_API_HOST=${LIVEKIT_API_HOST:-http://127.0.0.1:3336}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-zviewer-dev-secret}
      # 如需外置 LiveKit（多机部署），设 LIVEKIT_EXTERNAL=1 跳过内嵌拉起，
      # 并将 LIVEKIT_API_HOST 指向外部地址
      - LIVEKIT_EXTERNAL=${LIVEKIT_EXTERNAL:-0}
    volumes:
      - zviewer-data:/app/config
    restart: unless-stopped

volumes:
  zviewer-data:

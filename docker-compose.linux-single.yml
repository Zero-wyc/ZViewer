services:
  zviewer:
    build:
      context: .
      dockerfile: Dockerfile.linux-single
    ports:
      - "3333:3333"   # 统一端口：后端 API + WebSocket + 前端静态文件 + /live HTTP-FLV 代理
      - "3334:3334"   # RTMP 推流 (OBS)
    environment:
      # 语音聊天（LiveKit）：LIVEKIT_URL 是「浏览器直连」的地址，须为
      # 用户可达的 ws 地址——公网/NAT 部署时配置为外部 ws://主机:7880
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://localhost:7880}
      - LIVEKIT_API_HOST=${LIVEKIT_API_HOST:-http://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-zviewer-dev-secret}
    volumes:
      - zviewer-data:/app/config
    restart: unless-stopped
    depends_on:
      - livekit

  # 语音聊天 SFU（LiveKit）：--dev 模式单二进制开箱即用；生产部署请
  # 挂载正式 config.yaml 并更换 API key/secret
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --keys devkey:zviewer-dev-secret
    ports:
      - "7880:7880"                     # WebSocket 信令（客户端连接）
      - "50000-60000:50000-60000/udp"   # WebRTC 媒体传输
    restart: unless-stopped

volumes:
  zviewer-data:

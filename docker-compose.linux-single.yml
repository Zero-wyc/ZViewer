services:
  zviewer:
    build:
      context: .
      dockerfile: Dockerfile.linux-single
    ports:
      - "3333:3333"     # 统一端口：后端 API + WebSocket + 前端静态文件 + /live HTTP-FLV 代理
      - "3333:3333/udp" # 语音与屏幕共享的媒体面（与页面 HTTP 同号，协议不同）
      - "3334:3334"     # RTMP 推流 (OBS)
      - "3337:3337"     # 媒体 TCP（UDP 被防火墙/代理拦截时客户端自动回退到此端口）
    environment:
      # 语音与屏幕共享的媒体面由后端进程自己提供（不再有 livekit-server 子进程，
      # 也就没有 /rtc 反代与独立的信令端口）。
      # 媒体 UDP 跟随网页端口（同号不同协议）；媒体 TCP 必须单独一个号，
      # 客户端在 UDP 被拦截时会自动回退到它。
      - SHARE_MEDIA_PORT=${SHARE_MEDIA_PORT:-3333}
      - SHARE_MEDIA_TCP_PORT=${SHARE_MEDIA_TCP_PORT:-3337}
      # NAT 1:1（云主机 / 只做端口转发的 FRP）：填宿主公网 IP。留空时候选里只有
      # 容器内网地址（172.x），信令能通但媒体连不上；STUN 发现对容器不可靠。
      - SHARE_MEDIA_PUBLIC_IP=${SHARE_MEDIA_PUBLIC_IP:-}
      # 屏幕共享走服务端 SFU（房主只上行一份，代价是服务端带宽）。
      # 默认 0 = 观众与房主直连（服务端只转发信令）。
      - SHARE_RELAY=${SHARE_RELAY:-0}
      # 一起听（网易云）由后端自带（internal/ncm），不需要任何外部服务
    volumes:
      - zviewer-data:/app/config
    restart: unless-stopped

volumes:
  zviewer-data:

services:
  zviewer:
    build:
      context: .
      dockerfile: Dockerfile.linux-single
    ports:
      - "3333:3333"     # 统一端口：后端 API + WebSocket + 前端静态文件 + /live HTTP-FLV 代理
      - "3333:3333/udp" # 语音与屏幕共享中继的媒体面（与页面 HTTP 同号，协议不同）
      - "3334:3334"     # RTMP 推流 (OBS)
      - "3337:3337"     # 媒体 TCP（UDP 被防火墙/代理拦截时客户端自动回退到此端口）
      - "3478:3478/udp" # 自带 STUN，共享与语音打洞；不需要可删掉这行并设 STUN_PORT=0
      - "3332:3332"     # 网页控制台（zviewer-webgui，独立进程；不需要可删掉这行）
    environment:
      # 网页控制台端口（容器内监听，与上面的映射对应）
      - WEBGUI_PORT=${WEBGUI_PORT:-3332}
      # 访问/刷新令牌有效期；Cookie 的 Max-Age 跟着它走（改小会让已登录用户被登出）
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-24h}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}
      # 语音与屏幕共享的媒体面由后端进程自己提供（不再有 livekit-server 子进程，
      # 也就没有 /rtc 反代与独立的信令端口）。
      # 媒体 UDP 跟随网页端口（同号不同协议）；媒体 TCP 必须单独一个号，
      # 客户端在 UDP 被拦截时会自动回退到它。
      - SHARE_MEDIA_PORT=${SHARE_MEDIA_PORT:-3333}
      - SHARE_MEDIA_TCP_PORT=${SHARE_MEDIA_TCP_PORT:-3337}
      # 屏幕共享的媒体路径：off 只直连，fallback（默认）直连打不通才由本机 SFU
      # 转发，only 全部经服务器中转。中转复用上面那对 UDP/TCP 端口。
      - SHARE_SFU_MODE=${SHARE_SFU_MODE:-fallback}
      # 自带 STUN：优先于公共 STUN 下发。公网部署要设 STUN_PUBLIC_HOST，
      # 否则 ICE 里只有容器内网地址。
      - STUN_PORT=${STUN_PORT:-3478}
      - STUN_PUBLIC_HOST=${STUN_PUBLIC_HOST:-}
      # NAT 1:1（云主机 / 只做端口转发的 FRP）：填宿主公网 IP。留空时候选里只有
      # 容器内网地址（172.x），信令能通但媒体连不上；STUN 发现对容器不可靠。
      - SHARE_MEDIA_PUBLIC_IP=${SHARE_MEDIA_PUBLIC_IP:-}
      # 一起听（网易云）由后端自带（internal/ncm），不需要任何外部服务
    volumes:
      - zviewer-data:/app/config
    restart: unless-stopped

volumes:
  zviewer-data:

services:
  zviewer:
    build:
      context: .
      dockerfile: Dockerfile.linux-single
    ports:
      - "3333:3333"   # 统一端口：后端 API + WebSocket + 前端静态文件 + /live HTTP-FLV 代理
      - "3334:3334"   # RTMP 推流 (OBS)
    environment:
      # 语音聊天（LiveKit）：客户端信令地址按请求头自动推导（跟随页面域名
      # 与协议，HTTPS 页面自动 wss），无需在此配置；特殊域名可显式设置
      # LIVEKIT_URL 覆盖。媒体 RTP 走 3333/udp（与页面 HTTP 同号不同协议）
      - LIVEKIT_API_HOST=${LIVEKIT_API_HOST:-http://livekit:3336}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-zviewer-dev-secret}
    volumes:
      - zviewer-data:/app/config
    restart: unless-stopped
    depends_on:
      - livekit

  # 语音聊天 SFU（LiveKit）：--dev 模式单二进制开箱即用；HTTP/信令端口
  # 统一为 3336（仅容器内互通，浏览器信令经 zviewer:3333 的 /rtc 反代）；
  # 生产部署请挂载正式 config.yaml 并更换 API key/secret
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --port 3336 --keys devkey:zviewer-dev-secret
    ports:
      - "3333:3333/udp"   # WebRTC 媒体传输（与页面 HTTP 同号，协议不同）
    restart: unless-stopped

volumes:
  zviewer-data:

# Gitee Go 流水线（可选）：从 GitHub 拉取正式版 Release 并发布到 Gitee 发行版。
#
# ⚠️ 现状：主路径已经是 GitHub 的 build.yml 直接推到 Gitee（同一个脚本，附件复用本地构建产物），
# 这条流水线只作「补漏」：比如 GitHub 侧推送失败、或想手动重发某个历史版本。
#
# 因此这里**没有配置自动触发**，只能在 Gitee Go 页面点「运行」手动执行。
# 旧写法（npmbuild@1 + inputs）在当前平台版本上会被判「不支持的任务类型」，
# 所以改用新版插件标识 build@nodejs，命令直接写在 commands 里。
# 等它在页面上跑绿了，再把下面的 triggers 打开：
#
#   triggers:
#     push:
#       tags:
#         prefix:
#           - v
#     schedule:
#       - cron: '0 30 0/12 * * ?'   # Quartz 六段式：每天 00:30 / 12:30 兜底
#
# 前置条件：仓库「管理 → 环境变量」里配 GITEE_TOKEN（私人令牌，勾 projects）。

version: '1.0'
name: sync-release-from-github
displayName: 同步 GitHub 发行版

variables:
  GITHUB_REPO: Zero-wyc/ZViewer
  GITEE_OWNER: Zero-wyc
  GITEE_REPO: ZViewer

stages:
  - stage: sync
    displayName: 同步发行版
    strategy: fast
    trigger: auto
    steps:
      - step: build@nodejs
        name: pull_release
        displayName: 拉取 GitHub 发行版并上传
        nodeVersion: 20
        commands:
          - node -v
          - echo "同步 ${GITHUB_REPO} → ${GITEE_OWNER}/${GITEE_REPO}"
          - node scripts/sync-release-to-gitee.mjs

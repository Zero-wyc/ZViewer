name: GitCode Release 附件修复

# 一键把某个 tag 的产物重新挂到 GitCode Release 上（不重新构建）。
#
# 用途：
#   1. 历史上 GitCode 的 v5.0.2 ~ v5.0.6 都只剩 4 个源码包（附件没挂上/被清掉），
#      跑一次本 workflow 就能补齐，不用重新打 tag；
#   2. 以后万一某个 Release 又只剩源码包，同样一键修，几秒钟就能确认是不是平台侧问题。
#
# 产物从 GitHub 同名 Release 直接下载（gh release download），校验由
# scripts/sync-gitcode-release.mjs 负责：每个附件都要 type=attach + id + size 对得上，
# 并且真的从 attach_files/{name}/download 读一次。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'GitCode 上的 tag（如 v5.0.6、dev）'
        required: true
      github_tag:
        description: '对应的 GitHub Release tag，留空表示与上面相同；GitCode 的 dev 对应 GitHub 的 latest'
        required: false
        default: ''
      prerelease:
        description: 'GitCode 侧标为预发布（dev/latest 用 1）'
        required: false
        default: '0'

permissions:
  contents: read

env:
  GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
  GITCODE_OWNER: Zero-wyc
  GITCODE_REPO: ZViewer

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      GH_TAG: ${{ inputs.github_tag != '' && inputs.github_tag || inputs.tag }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: 缺令牌
        if: env.GITCODE_TOKEN == ''
        run: |
          echo "::error::没有 GITCODE_TOKEN，无法上传。请确认仓库 secret 已配置。"
          exit 1

      # 产物已经在 GitHub Release 上，直接取回来，避免为了补附件再跑一次完整构建
      - name: 从 GitHub Release 下载产物
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$GH_TAG" --pattern 'zviewer-*' --dir assets --clobber
          ls -lh assets

      - name: 补传附件并核验
        env:
          RELEASE_NAME: ${{ inputs.tag }}
          # 已存在的同名 Release 不删不重建，只补缺失的附件（跨境链路很贵，
          # 已经在且可用的文件会被跳过）
          NO_RECREATE: '1'
          VERIFY_DOWNLOAD: '1'
          UPLOAD_ATTEMPTS: '3'
          ASSETS: >-
            assets/zviewer-linux-x64.tar.gz
            assets/zviewer-windows-x64.zip
            assets/zviewer-windows-x64-GUI.zip
        run: node scripts/sync-gitcode-release.mjs

      - name: 结果
        if: always()
        run: |
          echo "GitCode 版本页：https://gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}/releases/tag/${TAG}"

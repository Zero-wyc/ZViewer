# GitCode 附件上传「路径对照」探针。
#
# 背景：GitHub → GitCode 同步很慢，实测瓶颈不在上传带宽（37MB 约 15s 发完），
# 而在 GitCode 登记附件（PUT 的回包要等回调结束，平台忙时约 110s/MB）。
# 现在脚本走「upload_url → OBS PUT」两步式；xzl01/action-gitcode-release 用的是
# 「POST /attach_files 的 multipart 表单」一步式，不经过 OBS 预签名。
#
# 这个 workflow 就是拿同一个文件把两条链路各跑一次，用三个时间点判断谁慢：
#   发完请求体 / 附件首次可见 / 收到回包
# 结果同时打到日志和 Job Summary 的表格里。结论只有两种：
#   - post 明显更早登记 → 把同步脚本切到 multipart POST
#   - 两条差不多      → 瓶颈是平台登记，换路径救不了，只能靠等待与重跑
#
# 用法：Actions → 本 workflow → Run workflow，默认 37MB / post+put 就够。
# 跑完的 Release 删不掉（GitCode 没有删 Release 的 API），附件默认会自动删；
# 想留着去页面上看，把 delete_after 关掉。

name: GitCode 上传路径对照探针

on:
  workflow_dispatch:
    inputs:
      size_mb:
        description: '测试文件大小（MB）'
        required: false
        default: '37'
      paths:
        description: '要对比的路径，逗号分隔：post（multipart 一步式）/ put（upload_url + OBS）'
        required: false
        default: 'post,put'
      timeout_minutes:
        description: '单条路径「请求体发完后」等回包的上限（分钟）'
        required: false
        default: '60'
      delete_after:
        description: '1 = 测完删除探针附件；0 = 保留'
        required: false
        default: '1'
      tag:
        description: '探针 Release 的 tag，留空则用 probe-upload-<run_id>'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # 两条路径各最多 timeout_minutes（默认 60），再加生成文件与收尾
    timeout-minutes: 180
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_OWNER: Zero-wyc
      GITCODE_REPO: ZViewer
      TAG_INPUT: ${{ inputs.tag }}
    steps:
      - name: Check GitCode token
        if: env.GITCODE_TOKEN == ''
        run: |
          echo "::error::没有 GITCODE_TOKEN，无法上传。请确认仓库 secret 已配置。"
          exit 1

      - uses: actions/checkout@v5

      # 与 build.yml / sync-gitcode-release.yml 保持同一个 node 版本
      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Resolve probe tag
        id: tag
        shell: bash
        run: |
          if [ -n "$TAG_INPUT" ]; then
            echo "tag=$TAG_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "tag=probe-upload-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate test file
        shell: bash
        env:
          SIZE_MB: ${{ inputs.size_mb }}
        run: |
          set -euo pipefail
          head -c $(( SIZE_MB * 1048576 )) /dev/urandom > probe.bin
          ls -l probe.bin

      # 同一份文件、同一个 Release，POST 与 PUT 各传一次（附件名不同）。
      # 脚本内部会并行轮询附件列表，记录「第一次可见」的时刻。
      - name: Compare upload paths
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ASSET_PATH: probe.bin
          LABEL: ${{ inputs.size_mb }}mb
          PATHS: ${{ inputs.paths }}
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          DELETE_AFTER: ${{ inputs.delete_after }}
        run: node scripts/probe-gitcode-upload.mjs

      - name: Cleanup note
        if: always()
        run: |
          echo "探针 Release：https://gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}/releases/tag/${{ steps.tag.outputs.tag }}"
          echo "GitCode 没有删除 Release 的 API，如需清理请在该页面手动删除。"

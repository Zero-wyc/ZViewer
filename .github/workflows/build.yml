# ZViewer 自动构建：单文件版（Windows + Linux）、Docker 镜像与 Windows GUI
# Windows GUI（Go/Wails 原生壳）在 build-gui job 中构建，产物与单文件版一起进 Release。
# 触发方式：
#   1. push 到 main 分支 → 构建并发布到 GitHub Releases (prerelease tag: latest)
#   2. push tag (v*) → 构建并发布到 GitHub Releases (正式版)
#   3. 手动触发（workflow_dispatch）→ 仅构建 + 上传 artifact
# 防双跑：发版时一次推送同时包含 main 与 tag（或先推 main 再推 tag）会触发
# 两次 workflow。gate job 在 main 推送时检测 HEAD 是否已被 v* tag 指向，
# 是则跳过 dev 构建（同 commit 的正式版构建会接管）。

name: Build (Single-File + Windows GUI)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # 防重复构建闸门：必须在所有触发方式下都运行（不可用 if 跳过——
  # needs 的 job 被跳过时，下游 job 会因隐式 success() 级联跳过，
  # 导致 tag 正式版构建也被吞掉）。触发类型判断放在脚本内部：
  # 仅 main push 且 HEAD 已被 v* tag 指向时输出 skip=true
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 再拉一次最新 tag，缩小竞态窗口（checkout 后、检测前 tag 才到远端的情况）
      - name: Refresh tags
        run: git fetch --tags --force origin

      - name: Check if HEAD is tagged
        id: gate
        shell: bash
        run: |
          SKIP=false
          if [ "${GITHUB_REF}" = "refs/heads/main" ] \
            && git tag --points-at HEAD | grep -q '^v'; then
            SKIP=true
            echo "HEAD 已被版本 tag 指向（$(git tag --points-at HEAD | grep '^v' | tr '\n' ' ')），正式版构建将接管，跳过 dev 构建"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    # gate 始终运行并输出 skip，此处条件可安全求值：
    # - main push 且 HEAD 已打 tag → skip=true 跳过（正式版接管）
    # - main push 未打 tag / tag push / 手动触发 → skip=false 正常构建
    if: needs.gate.outputs.skip != 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            flag: --linux
            artifact-name: zviewer-linux-x64
            dist-dir: linux
            ext: .tar.gz
          - os: windows-latest
            flag: --win
            artifact-name: zviewer-windows-x64
            dist-dir: win
            ext: .zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      # pkg 打包用的 Node base binary（~100MB/个）缓存，避免每次重复下载；
      # 若升级 @yao-pkg/pkg / pkg-fetch 或更换 pkg target 版本，需更新 key
      - name: Cache pkg base binaries
        uses: actions/cache@v6
        with:
          path: ~/.pkg-cache
          key: pkg-fetch-v3.6-node26-x64

      - name: Inject version
        # 根据触发方式注入版本号：
        # - tag 推送 (v*)：用 tag 名作为版本号（如 1.0.0）
        # - main 分支推送：用 0.0.0-dev.<sha前7位> 作为版本号
        # - 手动触发：用 0.0.0-manual 作为版本号
        shell: bash
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            VERSION="0.0.0-dev.${GITHUB_SHA:0:7}"
          else
            VERSION="0.0.0-manual"
          fi
          echo "Injecting version: $VERSION"
          node -e "const fs=require('fs');const p=require('./package.json');p.version='$VERSION';fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Install dependencies
        run: npm ci

      - name: Build & package single-file
        # build-all.js --win/--linux 会依次执行：
        #   1. vite 构建前端 → 2. go build 交叉编译后端
        #   3. 下载 livekit-server 伴生二进制 → 4. 复制启动脚本 → 5. 产物输出到 dist/<平台>/
        run: node build-all.js ${{ matrix.flag }}

      - name: Package artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: tar czf ${{ matrix.artifact-name }}.tar.gz -C dist/${{ matrix.dist-dir }} .

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path dist/${{ matrix.dist-dir }}/* -DestinationPath ${{ matrix.artifact-name }}.zip

      # 先上传 artifact，确保即使后续 Docker 步骤失败产物也不会丢失
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}${{ matrix.ext }}
          retention-days: 30

      # === Docker 镜像构建（仅 Linux） ===
      # 放在 artifact 上传之后，Docker 失败不影响产物保存
      - name: Set up Docker Buildx
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: matrix.os == 'ubuntu-latest'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker meta (tags)
        if: matrix.os == 'ubuntu-latest'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/zviewer
          # 正式版本号：仅 tag 推送（vX.Y.Z）产出 X.Y.Z 与 X.Y
          # latest 只跟随正式版本 tag，避免被 main 分支的开发构建覆盖
          # main 分支开发构建推到 dev，便于尝鲜但不动 latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        if: matrix.os == 'ubuntu-latest'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.linux-single
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Windows GUI（Go/Wails 原生壳）：复用 build 的 Windows 运行包，编译壳、组装目录并打 ZIP。
  # 只跑 windows-latest：ProcessHost 依赖 .NET Framework 的 csc.exe，壳链接 -H windowsgui。
  build-gui:
    needs: [gate, build]
    if: needs.gate.outputs.skip != 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 直接复用 build job 的 Windows 产物，保证 GUI 与单文件版是同一份后端与网页
      - name: Download Windows runtime
        uses: actions/download-artifact@v7
        with:
          name: zviewer-windows-x64
          path: dist/win

      - name: Extract runtime
        shell: pwsh
        run: Expand-Archive -Path dist/win/zviewer-windows-x64.zip -DestinationPath dist/win -Force

      # git checkout 不保留 mtime，syso 可能比 ico 旧，会使 build-shell 尝试用 rsrc 重新生成
      # （CI 未安装该工具）。这里把资源文件的时间戳推新，直接命中已入库的图标资源。
      - name: Refresh icon resource timestamp
        shell: bash
        run: touch desktop/rsrc_windows_amd64.syso

      - name: Inject version (desktop)
        shell: bash
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            VERSION="0.0.0-dev.${GITHUB_SHA:0:7}"
          else
            VERSION="0.0.0-manual"
          fi
          echo "Injecting desktop version: $VERSION"
          node -e "const fs=require('fs');const p=require('./desktop/package.json');p.version='$VERSION';fs.writeFileSync('./desktop/package.json',JSON.stringify(p,null,2)+'\n')"

      # shell:dist 依次：编译 ProcessHost（csc）→ 下载并校验 FRP（prepare-tools.ps1）
      # → go build 壳 → 复制 runtime、许可证 → 写 BUILD-MANIFEST.json
      # CLI 直接取运行包网页目录（dist/win/frontend/dist）里那份，与网页下载、
      # 单文件版共用同一二进制；缺失即失败，不会去 ZViewerCLI 源码重建。
      - name: Build portable GUI
        run: npm --prefix desktop run shell:dist

      - name: Package ZIP
        run: npm --prefix desktop run package

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v6
        with:
          name: zviewer-gui-windows-x64
          path: |
            desktop/dist-gui/*.zip
          retention-days: 30

  # main 分支推送：创建/更新 prerelease（tag: latest），确保持久化保存单文件产物
  release-latest:
    if: github.ref == 'refs/heads/main'
    needs: [build, build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 大陆镜像（GitCode，CSDN 平台）。未配置密钥时同步步骤整体跳过，不影响 GitHub 发版
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_OWNER: Zero-wyc
      GITCODE_REPO: ZViewer
    steps:
      # 供 GitCode 同步步骤推送 tag（附件下载不依赖 checkout，单独放在最前）
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: 'zviewer-*'
          merge-multiple: true

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub 与 GitCode 共用同一份说明，避免两边文案漂移
      - name: Generate release body
        shell: bash
        run: |
          REL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest"
          {
            echo "自动构建产物（main 分支最新代码）。"
            echo ""
            echo "## 下载"
            echo ""
            # 正文给直链的原因见 tag 发布那一步的注释：文件列表是异步加载的，
            # 国内网络下拉不出来时页面只剩 source code。
            echo "- **Windows**: [zviewer-windows-x64.zip](${REL}/zviewer-windows-x64.zip) — 解压后运行 \`start.bat\`"
            echo "- **Windows GUI**: [zviewer-windows-x64-GUI.zip](${REL}/zviewer-windows-x64-GUI.zip) — 解压后运行 \`ZViewerDesktop.exe\`"
            echo "- **Linux**: [zviewer-linux-x64.tar.gz](${REL}/zviewer-linux-x64.tar.gz) — 解压后运行 \`./start.sh\`"
            echo "- **Docker**: \`docker pull zerowyc0721/zviewer:dev\`（main 分支最新构建；正式版请用 \`:latest\` 或具体版本号）"
            echo ""
            echo "> 页面底部的文件列表加载不出来时，直接点上面的链接下载。"
            echo ""
            echo "构建提交: ${GITHUB_SHA}"
            echo "构建时间: ${COMMIT_TS}"
          } > release_body_latest.md
        env:
          COMMIT_TS: ${{ github.event.head_commit.timestamp }}

      # softprops/action-gh-release 只做"追加/覆盖同名"，不会清掉历史附件。
      # 之前 `gh release delete` 偶发失败被 `|| true` 吞掉，latest 里就留下了
      # 旧命名时代的产物（ZViewer-Windows-v0.0.0-dev.*、SHA256SUMS.txt），
      # 用户可能下到旧包。这里显式清一遍，保证只剩三个标准文件。
      - name: Remove stale assets from latest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            for name in $(gh release view latest --json assets --jq '.assets[].name'); do
              case "$name" in
                zviewer-linux-x64.tar.gz|zviewer-windows-x64.zip|zviewer-windows-x64-GUI.zip) continue ;;
              esac
              echo "清理历史附件: $name"
              gh release delete-asset latest "$name" --yes || true
            done
          fi

      - name: Create prerelease (latest)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build (main)
          body_path: release_body_latest.md
          files: |
            zviewer-linux-x64.tar.gz
            zviewer-windows-x64.zip
            zviewer-windows-x64-GUI.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # === 大陆镜像：把 tag 与附件同步到 GitCode（只做附加动作，失败不影响 GitHub 发版） ===
      # 注意：GitCode 的「仓库镜像 → Pull」会让仓库变成只读（官方限制：禁用推送代码/Tag/建 Release），
      # 所以这里一并负责主线同步；项目里必须关掉 Pull 镜像，否则整步会被 403 拒绝。
      - name: Push tag to GitCode
        id: gitcode-push
        if: env.GITCODE_TOKEN != ''
        continue-on-error: true
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git tag -f latest "${GITHUB_SHA}"
          REPO_URL="https://${GITCODE_OWNER}:${GITCODE_TOKEN}@gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}.git"
          git remote add gitcode "$REPO_URL" 2>/dev/null || git remote set-url gitcode "$REPO_URL"
          HINT='GitCode 拒绝写入：provider=image repository（Pull 镜像仓只读）。请到 GitCode「项目设置 → 仓库镜像」关闭 Pull 镜像后重跑；关闭后代码同步由本 workflow 负责。'
          # 只读镜像仓的重试没有意义：标记后跳过后续建 Release，只留一条可操作的报错
          push_or_stop() {
            local log
            if log=$(git push "$@" 2>&1); then
              echo "$log"
              return 0
            fi
            echo "$log"
            if echo "$log" | grep -qi 'image repository'; then
              echo "::error::$HINT"
              echo "readonly=true" >> "$GITHUB_OUTPUT"
              return 1
            fi
            return 2
          }
          # 主线：非强制推送；latest 是移动 tag，必须 --force
          set +e
          push_or_stop gitcode "HEAD:refs/heads/main"
          CODE=$?
          if [ "$CODE" = 0 ]; then
            push_or_stop gitcode "refs/tags/latest:refs/tags/latest" --force
            CODE=$?
          fi
          # 1 = 只读镜像仓（已输出可操作的报错），按绿色跳过；其它失败照常标红
          [ "$CODE" = 1 ] && exit 0
          exit "$CODE"

      - name: Publish to GitCode Release
        if: env.GITCODE_TOKEN != '' && steps.gitcode-push.outputs.readonly != 'true'
        continue-on-error: true
        env:
          TAG: latest
          RELEASE_NAME: Latest Build (main)
          RELEASE_BODY_FILE: release_body_latest.md
          PRERELEASE: '1'
          TARGET_COMMITISH: main
          ASSETS: >-
            zviewer-linux-x64.tar.gz
            zviewer-windows-x64.zip
            zviewer-windows-x64-GUI.zip
        run: node scripts/sync-gitcode-release.mjs

  # tag 推送：创建正式版 Release
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 大陆镜像（GitCode，CSDN 平台）。未配置密钥时同步步骤整体跳过，不影响 GitHub 发版
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_OWNER: Zero-wyc
      GITCODE_REPO: ZViewer
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate release body with commit summary
        # 收集自上一个 tag 以来的全部提交摘要，写入 release body。
        # 配合 generate_release_notes: true，GitHub 还会追加「New Contributors」
        # 与「Full Changelog」对比链接等结构化信息。
        shell: bash
        # 注意：本步骤 shell 为 `bash -e -o pipefail`，任何一步非零退出都会让整个
        # 步骤静默失败。故这里不出现 grep / head 这类会产生非零退出码的管道：
        # - 取上一 tag 用 git describe（tag 不存在时用 `|| true` 兜住）
        # - 截断用 git log --max-count（避免 head 提前关管道触发 SIGPIPE 141）
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${CURRENT_TAG#v}"
          REPO_SLUG="${GITHUB_REPOSITORY}"

          # checkout(fetch-depth: 0) 通常已取全 tag；显式再拉一次，防止浅取场景缺 tag
          git fetch --tags --force --quiet || true

          # 取「当前 tag 所在提交的最近祖先 tag」，不依赖 tag 创建时间先后
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --max-count=100 --pretty=format:"- %s" "${PREV_TAG}..${CURRENT_TAG}" || true)
          else
            # 没有上一个 tag（首次发布），列出当前 tag 指向提交的最近 100 条
            LOG=$(git log --max-count=100 --pretty=format:"- %s" "${CURRENT_TAG}" || true)
          fi
          {
            echo "## 更新内容"
            echo ""
            if [ -n "$LOG" ]; then
              echo "${LOG}"
            else
              echo "- 无提交记录"
            fi
            echo ""
            echo "---"
            echo ""
            echo "## 下载"
            echo ""
            # 正文里必须给直链：GitHub 新版页面的文件列表是异步加载的，
            # 国内网络下那一段经常请求失败，页面就只剩服务端直出的
            # source code，看起来像"只发了源码"。直链不依赖那段异步请求。
            REL="https://github.com/${REPO_SLUG}/releases/download/${CURRENT_TAG}"
            echo "- **Windows**: [zviewer-windows-x64.zip](${REL}/zviewer-windows-x64.zip) — 解压后运行 \`start.bat\`"
            echo "- **Windows GUI**: [zviewer-windows-x64-GUI.zip](${REL}/zviewer-windows-x64-GUI.zip) — 解压后运行 \`ZViewerDesktop.exe\`"
            echo "- **Linux**: [zviewer-linux-x64.tar.gz](${REL}/zviewer-linux-x64.tar.gz) — 解压后运行 \`./start.sh\`"
            echo "- **Docker**: \`docker pull zerowyc0721/zviewer:${VERSION}\`"
            echo ""
            echo "> 页面底部的文件列表加载不出来时，直接点上面的链接下载。"
          } > release_body.md
          echo "=== Generated release body ==="
          cat release_body.md

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: 'zviewer-*'
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_body.md
          files: |
            zviewer-linux-x64.tar.gz
            zviewer-windows-x64.zip
            zviewer-windows-x64-GUI.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitCode 的预发布状态只能靠 release_status 表达（pre/latest），
      # 必须沿用 GitHub 上同一个 Release 的 prerelease 标记，否则 GitCode 会把
      # 预发布当正式版推给用户（更新源默认就是 GitCode）。
      - name: Read prerelease flag
        id: pre
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          FLAG=$(gh release view "$TAG_NAME" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || echo false)
          echo "tag=$TAG_NAME prerelease=$FLAG"
          echo "value=$FLAG" >> "$GITHUB_OUTPUT"

      # === 大陆镜像：把同一份 Release 与附件发到 GitCode（附加动作，失败不影响 GitHub 发版） ===
      # GitCode 的 Pull 镜像仓是只读的（官方限制），项目里必须关掉「仓库镜像 → Pull」。
      - name: Push tag to GitCode
        id: gitcode-push
        if: env.GITCODE_TOKEN != ''
        continue-on-error: true
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # 本地 tag 与触发构建的提交对齐（checkout 已取全 tag，这里只做兜底）
          git tag -f "${TAG_NAME}" "${GITHUB_SHA}"
          REPO_URL="https://${GITCODE_OWNER}:${GITCODE_TOKEN}@gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}.git"
          git remote add gitcode "$REPO_URL" 2>/dev/null || git remote set-url gitcode "$REPO_URL"
          HINT='GitCode 拒绝写入：provider=image repository（Pull 镜像仓只读）。请到 GitCode「项目设置 → 仓库镜像」关闭 Pull 镜像后重跑；关闭后代码同步由本 workflow 负责。'
          # 只推 tag：commit 对象随 tag 一起送达，不覆盖镜像仓库的分支
          if ! log=$(git push gitcode "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}" --force 2>&1); then
            echo "$log"
            if echo "$log" | grep -qi 'image repository'; then
              echo "::error::$HINT"
              echo "readonly=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          echo "$log"

      - name: Publish to GitCode Release
        if: env.GITCODE_TOKEN != '' && steps.gitcode-push.outputs.readonly != 'true'
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_NAME: ${{ github.ref_name }}
          RELEASE_BODY_FILE: release_body.md
          PRERELEASE: ${{ steps.pre.outputs.value == 'true' && '1' || '0' }}
          TARGET_COMMITISH: main
          ASSETS: >-
            zviewer-linux-x64.tar.gz
            zviewer-windows-x64.zip
            zviewer-windows-x64-GUI.zip
        run: node scripts/sync-gitcode-release.mjs

# ZViewer 单文件版自动构建（Windows + Linux）
# 触发方式：
#   1. push 到 main 分支 → 构建并发布到 GitHub Releases (prerelease tag: latest)
#   2. push tag (v*) → 构建并发布到 GitHub Releases (正式版)
#   3. 手动触发（workflow_dispatch）→ 仅构建 + 上传 artifact

name: Build Single-File (Windows + Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            flag: --linux
            artifact-name: zviewer-linux-x64
            dist-dir: linux
            ext: .tar.gz
          - os: windows-latest
            flag: --win
            artifact-name: zviewer-windows-x64
            dist-dir: win
            ext: .zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Inject version
        # 根据触发方式注入版本号：
        # - tag 推送 (v*)：用 tag 名作为版本号（如 1.0.0）
        # - main 分支推送：用 0.0.0-dev.<sha前7位> 作为版本号
        # - 手动触发：用 0.0.0-manual 作为版本号
        shell: bash
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            VERSION="0.0.0-dev.${GITHUB_SHA:0:7}"
          else
            VERSION="0.0.0-manual"
          fi
          echo "Injecting version: $VERSION"
          node -e "const fs=require('fs');const p=require('./package.json');p.version='$VERSION';fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"
          # 同步更新 backend/package.json
          node -e "const fs=require('fs');const p=require('./backend/package.json');p.version='$VERSION';fs.writeFileSync('./backend/package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Install dependencies
        # 注：根 package.json 的 overrides 已把 playsvideo 的 mediabunny
        # git 依赖（kzahel fork，停在 1.38.1 且缺 DTS）改写到 registry 上游
        # 1.55.x，因此这里不需要任何 git 拉取，也就无需配置 SSH/HTTPS 重写。
        run: npm ci

      - name: Build & package single-file
        # build-all.js --win/--linux 会依次执行：
        #   1. tsc 编译后端 → 2. vite 构建前端 → 3. pkg 打包 3 个 exe
        #   4. 复制启动脚本 → 5. 产物输出到 dist/win/ 或 dist/linux/
        run: node build-all.js ${{ matrix.flag }}

      - name: Package artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: tar czf ${{ matrix.artifact-name }}.tar.gz -C dist/${{ matrix.dist-dir }} .

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path dist/${{ matrix.dist-dir }}/* -DestinationPath ${{ matrix.artifact-name }}.zip

      # 先上传 artifact，确保即使后续 Docker 步骤失败产物也不会丢失
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}${{ matrix.ext }}
          retention-days: 30

      # === Docker 镜像构建（仅 Linux） ===
      # 放在 artifact 上传之后，Docker 失败不影响产物保存
      - name: Set up Docker Buildx
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: matrix.os == 'ubuntu-latest'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker meta (tags)
        if: matrix.os == 'ubuntu-latest'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/zviewer
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        if: matrix.os == 'ubuntu-latest'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.linux-single
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # main 分支推送：创建/更新 prerelease（tag: latest），确保持久化保存单文件产物
  release-latest:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: 'zviewer-*'
          merge-multiple: true

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create prerelease (latest)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build (main)
          body: |
            自动构建产物（main 分支最新代码）。

            下载说明：
            - Windows: 下载 `zviewer-windows-x64.zip`，解压后运行 `start.bat`
            - Linux: 下载 `zviewer-linux-x64.tar.gz`，解压后运行 `./start.sh`
            - Docker: `docker pull <username>/zviewer:latest`

            构建提交: ${{ github.sha }}
            构建时间: ${{ github.event.head_commit.timestamp }}
          files: |
            zviewer-linux-x64.tar.gz
            zviewer-windows-x64.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # tag 推送：创建正式版 Release
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate release body with commit summary
        # 收集自上一个 tag 以来的全部提交摘要，写入 release body。
        # 配合 generate_release_notes: true，GitHub 还会追加「New Contributors」
        # 与「Full Changelog」对比链接等结构化信息。
        shell: bash
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          # 按创建时间倒序列出所有 tag，跳过当前 tag，取第一个即为上一个 tag
          PREV_TAG=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags | grep -v "^${CURRENT_TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" "${PREV_TAG}..${CURRENT_TAG}" | head -100)
          else
            # 没有上一个 tag（首次发布），列出当前 tag 指向提交的全部历史
            LOG=$(git log --pretty=format:"- %s" "${CURRENT_TAG}" | head -100)
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          {
            echo "## 更新内容"
            echo ""
            if [ -n "$LOG" ]; then
              echo "${LOG}"
            else
              echo "- 无提交记录"
            fi
            echo ""
            echo "---"
            echo ""
            echo "## 下载说明"
            echo ""
            echo "- **Windows**: 下载 \`zviewer-windows-x64.zip\`，解压后运行 \`start.bat\`"
            echo "- **Linux**: 下载 \`zviewer-linux-x64.tar.gz\`，解压后运行 \`./start.sh\`"
            echo "- **Docker**: \`docker pull <username>/zviewer:${VERSION}\`"
          } > release_body.md
          echo "=== Generated release body ==="
          cat release_body.md

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: 'zviewer-*'
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_body.md
          files: |
            zviewer-linux-x64.tar.gz
            zviewer-windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

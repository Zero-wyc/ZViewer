# ZViewer 自动构建：单文件版（Windows + Linux）、Docker 镜像与 Windows GUI
# Windows GUI（Go/Wails 原生壳）在 build-gui job 中构建，产物与单文件版一起进 Release。
#
# 触发方式（只保留手动与 tag，日常提交不再自动构建）：
#   1. 手动触发（workflow_dispatch），不填版本号 → 构建测试版，发布为 prerelease（tag: latest）
#   2. 手动触发（workflow_dispatch），填了版本号（如 v5.1.0）→ 构建正式版，自动建 tag 并发布 Release
#   3. push v* tag → 同上，走正式版发版（给习惯在本地打 tag 的人留的入口）
#
# 为什么不再跟着 main 自动构建：每次提交都跑一遍 130MB×3 的跨平台构建太浪费，
# 测试版改成需要时手动点一次；正式版必须显式给版本号，版本号不会被随手覆盖。
#
# 与 Gitee 的关系：这里只把**代码和 tag** 推到 Gitee，不在 GitHub 侧建 Gitee 发行版。
# Gitee 的 .workflow/sync-release.yml 在收到 v* tag 时自己拉取 GitHub Release 并上传附件
# （另有 12 小时兜底轮询）——跨境下载 + 境内上传都在 Gitee 机房完成，失败也不会连累这里的发版。

name: Build (Single-File + Windows GUI)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '版本号（如 v5.1.0）。填了=构建正式版并打 tag 发 Release；留空=只构建测试版（latest 预发布）'
        required: false
        default: ''
      ref:
        description: '构建哪个分支/tag/commit，留空用触发时选择的分支（默认 main）'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  # 统一在这里判定「这次是测试版还是正式版」，下游 job 只读 outputs，不再各自猜 GITHUB_REF。
  # 版本号校验放在这里：格式不对或该版本已发布，就在花 20 分钟构建之前失败。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.r.outputs.mode }}
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      sha: ${{ steps.r.outputs.sha }}
      ref_name: ${{ steps.r.outputs.ref_name }}
      docker_tags: ${{ steps.r.outputs.docker_tags }}
      push_image: ${{ steps.r.outputs.push_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve mode / tag / version
        id: r
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            REF_NAME="${GITHUB_REF#refs/tags/}"
          else
            REF_NAME="${GITHUB_REF#refs/heads/}"
          fi

          # 触发方式决定模式：推 tag → 正式版；手动填了版本号 → 正式版；否则测试版
          if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            MODE=release
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
            MODE=release
          else
            TAG=''
            MODE=dev
          fi

          if [ "$MODE" = 'release' ]; then
            if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "::error::版本号格式不对：${TAG}（应形如 v5.1.0）"
              exit 1
            fi
            # 已发布过的版本不许覆盖：Release 是可追溯的凭据，覆盖会让人分不清哪个包是哪个
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::error::${TAG} 已经有 Release 了。换一个版本号；要重传附件请先手动删掉该 Release"
              exit 1
            fi
            # tag 已存在但没有 Release：多半是上次构建中途失败，复用该 tag 重跑
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::warning::tag ${TAG} 已存在但没有 Release，本次复用它"
            fi
            VERSION="${TAG#v}"
            MAJOR_MINOR=$(printf '%s' "$VERSION" | cut -d. -f1,2)
            {
              echo 'docker_tags<<EOF'
              echo "type=raw,value=${VERSION}"
              echo "type=raw,value=${MAJOR_MINOR}"
              echo 'type=raw,value=latest'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            PUSH_IMAGE=true
          else
            VERSION="0.0.0-dev.${SHA:0:7}"
            {
              echo 'docker_tags<<EOF'
              echo 'type=raw,value=dev'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            # 测试版只有从 main 构建时才推 Docker dev 镜像，从别的分支构建不该覆盖 dev
            if [ "$REF_NAME" = 'main' ]; then PUSH_IMAGE=true; else PUSH_IMAGE=false; fi
          fi

          echo "mode=${MODE} tag=${TAG:-（无）} version=${VERSION} sha=${SHA} ref=${REF_NAME}"
          {
            echo "mode=${MODE}"
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "sha=${SHA}"
            echo "ref_name=${REF_NAME}"
            echo "push_image=${PUSH_IMAGE}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            flag: --linux
            artifact-name: zviewer-linux-x64
            dist-dir: linux
            ext: .tar.gz
          - os: windows-latest
            flag: --win
            artifact-name: zviewer-windows-x64
            dist-dir: win
            ext: .zip
    runs-on: ${{ matrix.os }}

    steps:
      # 按 prepare 解析出的 commit 检出：手动触发时可以指定别的分支/commit，
      # 构建产物必须和后面打 tag 的提交严格一致。
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      # pkg 打包用的 Node base binary（~100MB/个）缓存，避免每次重复下载；
      # 若升级 @yao-pkg/pkg / pkg-fetch 或更换 pkg target 版本，需更新 key
      - name: Cache pkg base binaries
        uses: actions/cache@v6
        with:
          path: ~/.pkg-cache
          key: pkg-fetch-v3.6-node26-x64

      - name: Inject version
        # 版本号由 prepare 统一算好：正式版取 tag（v5.1.0 → 5.1.0），测试版取 0.0.0-dev.<sha前7位>
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "Injecting version: $VERSION"
          node -e "const fs=require('fs');const p=require('./package.json');p.version='$VERSION';fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Install dependencies
        run: npm ci

      - name: Build & package single-file
        # build-all.js --win/--linux 会依次执行：
        #   1. vite 构建前端 → 2. go build 交叉编译后端
        #   3. 下载 livekit-server 伴生二进制 → 4. 复制启动脚本 → 5. 产物输出到 dist/<平台>/
        run: node build-all.js ${{ matrix.flag }}

      - name: Package artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: tar czf ${{ matrix.artifact-name }}.tar.gz -C dist/${{ matrix.dist-dir }} .

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path dist/${{ matrix.dist-dir }}/* -DestinationPath ${{ matrix.artifact-name }}.zip

      # 先上传 artifact，确保即使后续 Docker 步骤失败产物也不会丢失
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}${{ matrix.ext }}
          retention-days: 30

      # === Docker 镜像构建（仅 Linux） ===
      # 放在 artifact 上传之后，Docker 失败不影响产物保存
      - name: Set up Docker Buildx
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: matrix.os == 'ubuntu-latest'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker meta (tags)
        if: matrix.os == 'ubuntu-latest'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/zviewer
          # 正式版产出 X.Y.Z、X.Y 与 latest；测试版只产出 dev。
          # 手动填版本号发版时 github.ref 还是 main，semver 规则取不到值，
          # 所以标签统一在 prepare 里按模式算好再传进来。
          tags: ${{ needs.prepare.outputs.docker_tags }}

      - name: Build and push Docker image
        if: matrix.os == 'ubuntu-latest'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.linux-single
          # 正式版必推；测试版只在 main 构建时推 dev，避免分支构建把 dev 覆盖掉
          push: ${{ needs.prepare.outputs.push_image == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Windows GUI（Go/Wails 原生壳）：复用 build 的 Windows 运行包，编译壳、组装目录并打 ZIP。
  # 只跑 windows-latest：ProcessHost 依赖 .NET Framework 的 csc.exe，壳链接 -H windowsgui。
  build-gui:
    needs: [prepare, build]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 直接复用 build job 的 Windows 产物，保证 GUI 与单文件版是同一份后端与网页
      - name: Download Windows runtime
        uses: actions/download-artifact@v7
        with:
          name: zviewer-windows-x64
          path: dist/win

      - name: Extract runtime
        shell: pwsh
        run: Expand-Archive -Path dist/win/zviewer-windows-x64.zip -DestinationPath dist/win -Force

      # git checkout 不保留 mtime，syso 可能比 ico 旧，会使 build-shell 尝试用 rsrc 重新生成
      # （CI 未安装该工具）。这里把资源文件的时间戳推新，直接命中已入库的图标资源。
      - name: Refresh icon resource timestamp
        shell: bash
        run: touch desktop/rsrc_windows_amd64.syso

      - name: Inject version (desktop)
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "Injecting desktop version: $VERSION"
          node -e "const fs=require('fs');const p=require('./desktop/package.json');p.version='$VERSION';fs.writeFileSync('./desktop/package.json',JSON.stringify(p,null,2)+'\n')"

      # shell:dist 依次：编译 ProcessHost（csc）→ 下载并校验 FRP（prepare-tools.ps1）
      # → go build 壳 → 复制 runtime、许可证 → 写 BUILD-MANIFEST.json
      # CLI 直接取运行包网页目录（dist/win/frontend/dist）里那份，与网页下载、
      # 单文件版共用同一二进制；缺失即失败，不会去 ZViewerCLI 源码重建。
      - name: Build portable GUI
        run: npm --prefix desktop run shell:dist

      - name: Package ZIP
        run: npm --prefix desktop run package

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v6
        with:
          name: zviewer-gui-windows-x64
          path: |
            desktop/dist-gui/*.zip
          retention-days: 30

  # 测试版（手动触发且没填版本号）：创建/更新 prerelease（tag: latest），持久化保存产物
  release-latest:
    if: needs.prepare.outputs.mode == 'dev'
    needs: [prepare, build, build-gui]
    runs-on: ubuntu-latest
    # 附件要从 GitHub runner 跨境传到华为云 OBS，139MB 实测可能跑十几分钟；给足上限
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # 大陆镜像（Gitee）。未配置密钥时同步步骤整体跳过，不影响 GitHub 发版
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: Zero-wyc
      GITEE_REPO: ZViewer
    steps:
      # 供 Gitee 同步步骤推送代码（附件下载不依赖 checkout，单独放在最前）
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: 'zviewer-*'
          merge-multiple: true

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub 与 Gitee 共用同一份说明，避免两边文案漂移
      - name: Generate release body
        shell: bash
        run: |
          REL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest"
          # 手动触发没有 head_commit.timestamp，退化成当前时间
          COMMIT_TS="${COMMIT_TS:-$(date -u '+%Y-%m-%d %H:%M:%S UTC')}"
          {
            echo "手动触发的测试构建（分支 ${BUILD_REF}，commit ${BUILD_SHA:0:7}）。"
            echo ""
            echo "## 下载"
            echo ""
            # 正文给直链的原因见 tag 发布那一步的注释：文件列表是异步加载的，
            # 国内网络下拉不出来时页面只剩 source code。
            echo "- **Windows**: [zviewer-windows-x64.zip](${REL}/zviewer-windows-x64.zip) — 解压后运行 \`start.bat\`"
            echo "- **Windows GUI**: [zviewer-windows-x64-GUI.zip](${REL}/zviewer-windows-x64-GUI.zip) — 解压后运行 \`ZViewerDesktop.exe\`"
            echo "- **Linux**: [zviewer-linux-x64.tar.gz](${REL}/zviewer-linux-x64.tar.gz) — 解压后运行 \`./start.sh\`"
            echo "- **Docker**: \`docker pull zerowyc0721/zviewer:dev\`（main 分支最新构建；正式版请用 \`:latest\` 或具体版本号）"
            echo ""
            echo "> 页面底部的文件列表加载不出来时，直接点上面的链接下载。"
            echo ""
            echo "构建提交: ${BUILD_SHA}"
            echo "构建时间: ${COMMIT_TS}"
          } > release_body_latest.md
        env:
          BUILD_SHA: ${{ needs.prepare.outputs.sha }}
          BUILD_REF: ${{ needs.prepare.outputs.ref_name }}
          COMMIT_TS: ${{ github.event.head_commit.timestamp }}

      # softprops/action-gh-release 只做"追加/覆盖同名"，不会清掉历史附件。
      # 之前 `gh release delete` 偶发失败被 `|| true` 吞掉，latest 里就留下了
      # 旧命名时代的产物（ZViewer-Windows-v0.0.0-dev.*、SHA256SUMS.txt），
      # 用户可能下到旧包。这里显式清一遍，保证只剩三个标准文件。
      - name: Remove stale assets from latest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            for name in $(gh release view latest --json assets --jq '.assets[].name'); do
              case "$name" in
                zviewer-linux-x64.tar.gz|zviewer-windows-x64.zip|zviewer-windows-x64-GUI.zip) continue ;;
              esac
              echo "清理历史附件: $name"
              gh release delete-asset latest "$name" --yes || true
            done
          fi

      - name: Create prerelease (latest)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build (main)
          body_path: release_body_latest.md
          files: |
            zviewer-linux-x64.tar.gz
            zviewer-windows-x64.zip
            zviewer-windows-x64-GUI.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 只同步代码：把 main 推过去，Gitee 上的发行版由那边的流水线自己拉取创建。
      - name: Push main branch to Gitee
        if: env.GITEE_TOKEN != '' && needs.prepare.outputs.ref_name == 'main'
        continue-on-error: true
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          REPO_URL="https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          git remote add gitee "$REPO_URL" 2>/dev/null || git remote set-url gitee "$REPO_URL"
          if ! log=$(git push gitee "HEAD:refs/heads/main" 2>&1); then
            echo "$log"
            echo "::error::推送到 Gitee 失败：确认 GITEE_TOKEN 有效且对 ${GITEE_OWNER}/${GITEE_REPO} 有写权限"
            exit 1
          fi
          echo "$log"

          # 发版通常就在 main 尖端：顺带把 Gitee 的 main 快进过去，
          # 避免长期只发版、不跑测试构建时 Gitee 的主线一直停在旧提交。
          # 非快进会失败，失败只警告，不倒推别人的主线。
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "${REMOTE_MAIN}" = "${TARGET_SHA}" ]; then
            git push gitee "HEAD:refs/heads/main" || echo "::warning::Gitee main 未更新（非快进或被改写），下次测试构建会补上"
          fi

  # 正式版：手动给了版本号（或直接推 v* tag）→ 建 tag 并发布 Release
  release:
    if: needs.prepare.outputs.mode == 'release'
    needs: [prepare, build, build-gui]
    runs-on: ubuntu-latest
    # 附件要从 GitHub runner 跨境传到华为云 OBS，139MB 实测可能跑十几分钟；给足上限
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # 大陆镜像（Gitee）。未配置密钥时同步步骤整体跳过，不影响 GitHub 发版
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: Zero-wyc
      GITEE_REPO: ZViewer
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Generate release body with commit summary
        # 收集自上一个 tag 以来的全部提交摘要，写入 release body。
        # 配合 generate_release_notes: true，GitHub 还会追加「New Contributors」
        # 与「Full Changelog」对比链接等结构化信息。
        shell: bash
        # 注意：本步骤 shell 为 `bash -e -o pipefail`，任何一步非零退出都会让整个
        # 步骤静默失败。故这里不出现 grep / head 这类会产生非零退出码的管道：
        # - 取上一 tag 用 git describe（tag 不存在时用 `|| true` 兜住）
        # - 截断用 git log --max-count（避免 head 提前关管道触发 SIGPIPE 141）
        env:
          # 手动发版时 github.ref 是 main，tag 只能从 prepare 拿
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          CURRENT_TAG="${TAG_NAME}"
          VERSION="${CURRENT_TAG#v}"
          REPO_SLUG="${GITHUB_REPOSITORY}"

          # checkout(fetch-depth: 0) 通常已取全 tag；显式再拉一次，防止浅取场景缺 tag
          git fetch --tags --force --quiet || true

          # 手动发版时 tag 要等后面创建 Release 才存在，这里用 commit 算范围；
          # 推 tag 触发时 tag 已经在本地，直接用 tag
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            CURRENT_REF="${CURRENT_TAG}"
          else
            CURRENT_REF="${TARGET_SHA}"
          fi

          # 取「当前提交的最近祖先 tag」，不依赖 tag 创建时间先后
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_REF}^" 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --max-count=100 --pretty=format:"- %s" "${PREV_TAG}..${CURRENT_REF}" || true)
          else
            # 没有上一个 tag（首次发布），列出当前提交的最近 100 条
            LOG=$(git log --max-count=100 --pretty=format:"- %s" "${CURRENT_REF}" || true)
          fi
          {
            echo "## 更新内容"
            echo ""
            if [ -n "$LOG" ]; then
              echo "${LOG}"
            else
              echo "- 无提交记录"
            fi
            echo ""
            echo "---"
            echo ""
            echo "## 下载"
            echo ""
            # 正文里必须给直链：GitHub 新版页面的文件列表是异步加载的，
            # 国内网络下那一段经常请求失败，页面就只剩服务端直出的
            # source code，看起来像"只发了源码"。直链不依赖那段异步请求。
            REL="https://github.com/${REPO_SLUG}/releases/download/${CURRENT_TAG}"
            echo "- **Windows**: [zviewer-windows-x64.zip](${REL}/zviewer-windows-x64.zip) — 解压后运行 \`start.bat\`"
            echo "- **Windows GUI**: [zviewer-windows-x64-GUI.zip](${REL}/zviewer-windows-x64-GUI.zip) — 解压后运行 \`ZViewerDesktop.exe\`"
            echo "- **Linux**: [zviewer-linux-x64.tar.gz](${REL}/zviewer-linux-x64.tar.gz) — 解压后运行 \`./start.sh\`"
            echo "- **Docker**: \`docker pull zerowyc0721/zviewer:${VERSION}\`"
            echo ""
            echo "> 页面底部的文件列表加载不出来时，直接点上面的链接下载。"
          } > release_body.md
          echo "=== Generated release body ==="
          cat release_body.md

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: 'zviewer-*'
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # 手动发版时 github.ref 还是 main，必须显式给 tag；
          # target_commitish 指向本次实际构建的 commit，tag 不存在时由 API 建在它上面
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: release_body.md
          files: |
            zviewer-linux-x64.tar.gz
            zviewer-windows-x64.zip
            zviewer-windows-x64-GUI.zip
          generate_release_notes: true
          # 带 -rc.1 / -beta 这类后缀的版本自动标成预发布
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 只推 tag，不在 GitHub 侧建 Gitee 发行版：Gitee 的 .workflow/sync-release.yml
      # 收到 v* tag 后会自己拉取 GitHub Release 并上传附件。
      # commit 对象随 tag 一起送达，不动镜像仓库的分支。
      - name: Push tag to Gitee
        if: env.GITEE_TOKEN != ''
        continue-on-error: true
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          # 本地 tag 与本次构建的提交对齐：手动发版时 tag 是刚刚由 Release API 建的，
          # 本地还没有；直接把 SHA 作为 tag 目标，保证 Gitee 上的 tag 指到同一个 commit
          git tag -f "${TAG_NAME}" "${TARGET_SHA}"
          REPO_URL="https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          git remote add gitee "$REPO_URL" 2>/dev/null || git remote set-url gitee "$REPO_URL"
          if ! log=$(git push gitee "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}" --force 2>&1); then
            echo "$log"
            echo "::error::推送到 Gitee 失败：确认 GITEE_TOKEN 有效且对 ${GITEE_OWNER}/${GITEE_REPO} 有写权限"
            exit 1
          fi
          echo "$log"

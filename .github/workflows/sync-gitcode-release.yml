# 把 GitHub 上刚发布的 Release 同步到 GitCode（大陆镜像）。
#
# 触发方式：由 build.yml 在 release / release-latest 成功后以 workflow_call 调用，
# 也可以用 workflow_dispatch 手动补同步或重试。GitCode 相关逻辑全部留在这个文件里，
# build.yml 只负责在发版完成后调用一次。
#
# 为什么不用 `on: release`：Release 是 build.yml 用仓库自带的 GITHUB_TOKEN 创建的，
# 而「由 GITHUB_TOKEN 触发的事件不会产生新的 workflow run」（GitHub 的防递归规则），
# 所以 release 事件在本仓库永远不会落地。
# 为什么不用 `on: workflow_run`：本仓库实测该事件从未投递（仓库内 workflow_run 类型的
# run 数为 0），监听器既不会自动触发也不报错；改成同一次运行内的 workflow_call，
# 顺序天然排在 GitHub 发布之后，不再依赖事件投递。

name: Sync Release to GitCode

on:
  workflow_call:
    inputs:
      tag:
        description: 要同步的 GitHub Release tag（latest = main 分支镜像）
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 要同步的 GitHub Release tag（latest = main 分支镜像；留空取最新正式版）
        required: false
        type: string

permissions:
  contents: read
  actions: read

# 只对「同一个 tag」串行：latest 会被频繁重建，两轮并发会把同一批大文件重复上传。
# 不能用一个全局锁——某一轮卡在上传里时，会把其它 tag（包括 build 自动调用进来的一轮）
# 全部堵在 pending，自动同步看起来就像「没触发」。
concurrency:
  group: sync-gitcode-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 三个附件共约 130MB，跨境传到华为云 OBS，给足上限
    timeout-minutes: 90
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_OWNER: Zero-wyc
      GITCODE_REPO: ZViewer
    steps:
      # 没有令牌时后面每一步都会被 if 跳过，job 会「绿色但什么都没做」。
      # 这里直接失败，避免误以为同步成功。
      - name: Check GitCode token
        if: env.GITCODE_TOKEN == ''
        run: |
          echo "::error::没有 GITCODE_TOKEN，无法同步到 GitCode。请在仓库 Secrets 里配置后重跑。"
          exit 1

      # 先算出「要同步哪个 GitHub Release、对应 GitCode 的哪个 tag」
      - name: Resolve target release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # gh 需要仓库上下文；workflow_dispatch 进来时还没 checkout，没有 .git，
          # 只能靠 GH_REPO 指定，否则 gh 会报 "not a git repository"。
          TAG="${INPUT_TAG}"
          if [ -z "$TAG" ]; then
            # 手动触发且没填 tag：取 GitHub 上最新的正式版
            TAG=$(gh release view --json tagName --jq '.tagName')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::无法确定要同步的 Release tag"
            exit 1
          fi

          INFO=$(gh release view "$TAG" --json name,isPrerelease --jq '[.name, .isPrerelease] | @tsv')
          NAME=${INFO%%$'\t'*}
          IS_PRE=${INFO##*$'\t'}

          # GitCode 的 /releases/latest 是「最新 Release」的别名，按 tag 寻址会打到正式版，
          # 所以 main 分支的镜像 Release 用 dev 这个 tag。
          if [ "$TAG" = "latest" ]; then
            GC_TAG=dev
          else
            GC_TAG="$TAG"
          fi

          {
            echo "tag=$TAG"
            echo "gitcode_tag=$GC_TAG"
            echo "name=$NAME"
            echo "prerelease=${IS_PRE:-false}"
          } >> "$GITHUB_OUTPUT"
          echo "GitHub Release $TAG（prerelease=$IS_PRE）→ GitCode $GC_TAG"

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0

      # main 推送时若 HEAD 已被 v* tag 指向，build.yml 的 gate 会跳过 dev 构建、不产生新
      # Release。这一轮没有可同步的东西，留给版本 tag 那一轮，避免白传 130MB。
      - name: Check whether this run produced a Release
        id: gate
        if: steps.resolve.outputs.tag == 'latest'
        shell: bash
        run: |
          # 不用 `git tag | grep -q`：grep 提前退出会让 git tag 收到 SIGPIPE，
          # 配合 pipefail 会把「命中」判成失败。
          TAGS=$(git tag --points-at HEAD | grep '^v' || true)
          if [ -n "$TAGS" ]; then
            echo "HEAD 已被版本 tag 指向（${TAGS//$'\n'/ }），本轮没有新 Release，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.resolve.outputs.tag }}" --dir . --clobber
          ls -lh zviewer-*

      # GitCode 与 GitHub 的下载地址不同，正文里的直链要换成本站地址；
      # 否则「文件列表加载不出来」时用户点到的仍是 GitHub 直链。
      - name: Generate GitCode release body
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          gh release view "$TAG" --json body --jq '.body // ""' > release_body.md
          sed -E \
            "s#https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/#https://gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}/releases/download/${{ steps.resolve.outputs.gitcode_tag }}/#g" \
            release_body.md > release_body.gitcode.md
          grep -c 'gitcode.com' release_body.gitcode.md || true

      # 注意：GitCode 的「仓库镜像 → Pull」会让仓库只读（官方限制：禁用推送代码/Tag/建 Release），
      # 项目里必须关掉 Pull 镜像，否则整步会被 403 拒绝。
      - name: Push tag to GitCode
        id: gitcode-push
        if: steps.gate.outputs.skip != 'true' && env.GITCODE_TOKEN != ''
        continue-on-error: true
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
          SOURCE_TAG: ${{ steps.resolve.outputs.tag }}
          GC_TAG: ${{ steps.resolve.outputs.gitcode_tag }}
        run: |
          REPO_URL="https://${GITCODE_OWNER}:${GITCODE_TOKEN}@gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}.git"
          git remote add gitcode "$REPO_URL" 2>/dev/null || git remote set-url gitcode "$REPO_URL"
          HINT='GitCode 拒绝写入：provider=image repository（Pull 镜像仓只读）。请到 GitCode「项目设置 → 仓库镜像」关闭 Pull 镜像后重跑；关闭后代码同步由本 workflow 负责。'
          # 只读镜像仓的重试没有意义：标记后跳过后续建 Release，只留一条可操作的报错
          push_or_stop() {
            local log
            if log=$(git push "$@" 2>&1); then
              echo "$log"
              return 0
            fi
            echo "$log"
            if echo "$log" | grep -qi 'image repository'; then
              echo "::error::$HINT"
              echo "readonly=true" >> "$GITHUB_OUTPUT"
              return 1
            fi
            return 2
          }
          git tag -f "$GC_TAG" HEAD
          set +e
          if [ "$SOURCE_TAG" = "latest" ]; then
            # main 构建：主线与移动 tag dev 一起同步
            push_or_stop gitcode "HEAD:refs/heads/main"
            CODE=$?
            if [ "$CODE" = 0 ]; then
              push_or_stop gitcode "refs/tags/${GC_TAG}:refs/tags/${GC_TAG}" --force
              CODE=$?
            fi
          else
            # 版本 tag：commit 对象随 tag 一起送达，不去动镜像仓库的分支
            push_or_stop gitcode "refs/tags/${GC_TAG}:refs/tags/${GC_TAG}" --force
            CODE=$?
            # 发版时 main 与 tag 一起推、gate 跳过了 dev 构建的情况：这个 tag 恰好就是
            # GitHub main 的尖端，顺手把主线同步过去（非快进失败只警告，不倒推镜像 main）。
            if [ "$CODE" = 0 ] && [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)" ]; then
              push_or_stop gitcode "HEAD:refs/heads/main" || echo "::warning::GitCode main 未更新（非快进或被改写）"
            fi
          fi
          # 1 = 只读镜像仓（已输出可操作的报错），按绿色跳过；其它失败照常标红
          [ "$CODE" = 1 ] && exit 0
          exit "$CODE"

      # 同步脚本必须用 main 上的最新版，不能用 Release tag 自带的那份：否则脚本修了
      # 对存量 tag 永远不生效（v5.0.8 就是例子，tag 里还是旧的「先删后建」，一遇到
      # 已存在的 Release 就 405）。取到 RUNNER_TEMP 再执行，工作目录仍是仓库根，
      # ASSETS 里的相对路径不受影响。
      - name: Fetch sync script from main
        if: steps.gate.outputs.skip != 'true' && env.GITCODE_TOKEN != ''
        shell: bash
        run: |
          git fetch --quiet origin main
          git show FETCH_HEAD:scripts/sync-gitcode-release.mjs > "$RUNNER_TEMP/sync-gitcode-release.mjs"
          echo "使用 main@$(git rev-parse --short FETCH_HEAD) 的同步脚本"

      - name: Setup Node.js 26
        if: steps.gate.outputs.skip != 'true' && env.GITCODE_TOKEN != '' && steps.gitcode-push.outputs.readonly != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      # 为什么不用 space-ast/action-git-release：它用 undici 的 fetch 直传 130MB 附件，
      # 实测会卡在整个步骤里不动（v5.0.8 那次挂起 50 分钟、一个附件都没挂上，直到 job
      # 超时才结束）。scripts/sync-gitcode-release.mjs 是 node:https 直连 PUT，带
      # Content-Length 与「10 分钟无进展」的停滞检测，v5.0.7 实测 15 分钟传完三个包并
      # 回读校验真的挂上了。gitcode-repair.yml 用的也是这条链路，只留一条上传路径。
      - name: Publish to GitCode Release
        if: steps.gate.outputs.skip != 'true' && env.GITCODE_TOKEN != '' && steps.gitcode-push.outputs.readonly != 'true'
        shell: bash
        env:
          # GitCode 的 tag：main 构建是 dev，版本 tag 与 GitHub 相同
          TAG: ${{ steps.resolve.outputs.gitcode_tag }}
          RELEASE_NAME: ${{ steps.resolve.outputs.name }}
          RELEASE_BODY_FILE: release_body.gitcode.md
          PRERELEASE: ${{ steps.resolve.outputs.prerelease == 'true' && '1' || '0' }}
          TARGET_COMMITISH: main
          # 单个附件最多 3 次（每次停滞超过 10 分钟自动中断），最坏情况仍能在 job 超时内结束
          UPLOAD_ATTEMPTS: '3'
          ASSETS: >-
            zviewer-linux-x64.tar.gz
            zviewer-windows-x64.zip
            zviewer-windows-x64-GUI.zip
        run: |
          ls -lh zviewer-*
          node "$RUNNER_TEMP/sync-gitcode-release.mjs"

# 临时诊断：找 GitCode 附件上传的「体积临界点」。
# 用完即删。

name: GitCode 上传体积诊断

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKEN: ${{ secrets.GITCODE_TOKEN }}
      API: https://api.gitcode.com/api/v5/repos/Zero-wyc/ZViewer
    steps:
      - name: 造不同体积的测试文件
        run: |
          head -c 1048576  /dev/urandom > f-1mb.bin
          head -c 5242880  /dev/urandom > f-5mb.bin
          head -c 20971520 /dev/urandom > f-20mb.bin
          head -c 38797685 /dev/urandom > f-37mb.bin
          ls -l f-*.bin

      - name: 逐个上传并等待登记
        run: |
          set -uo pipefail
          TAG="probe-size-${{ github.run_id }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          curl -sS -X POST "$API/releases?access_token=$TOKEN" -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"diag\",\"release_status\":\"pre\",\"target_commitish\":\"main\"}" \
            -o /dev/null -w 'create HTTP %{http_code}\n'
          for f in f-1mb.bin f-5mb.bin f-20mb.bin f-37mb.bin; do
            echo "===== $f"
            curl -sS "$API/releases/$TAG/upload_url?file_name=$f&access_token=$TOKEN" -o t.json -w 'ticket HTTP %{http_code}\n'
            node - "$f" <<'JS'
          const fs = require('fs');
          const https = require('https');
          const name = process.argv[2];
          const t = JSON.parse(fs.readFileSync('t.json', 'utf8'));
          const body = fs.readFileSync(name);
          const u = new URL(t.url);
          const headers = { ...(t.headers || {}), 'Content-Length': String(body.length) };
          const started = Date.now();
          const elapsed = () => ((Date.now() - started) / 1000).toFixed(1);
          const req = (u.protocol === 'http:' ? require('http') : https).request(
            u, { method: 'PUT', headers, agent: false, timeout: 0 },
            (res) => {
              const chunks = [];
              res.on('data', (c) => chunks.push(c));
              res.on('end', () => {
                console.log(`${name} PUT ${res.statusCode} in ${elapsed()}s body=${Buffer.concat(chunks).toString().slice(0, 200)}`);
                process.exit(0);
              });
            },
          );
          req.on('error', (e) => { console.log(`${name} ERROR ${e.message} at ${elapsed()}s`); process.exit(1); });
          const iv = setInterval(() => console.log(`${name} ${elapsed()}s written=${req.socket?.bytesWritten}`), 30000);
          req.end(body);
          setTimeout(() => { clearInterval(iv); console.log(`${name} TIMEOUT 10min，未回包`); process.exit(2); }, 600000);
          JS
            sleep 5
            curl -sS "$API/releases/$TAG?access_token=$TOKEN&temp_download_url=false" -o r.json
            python3 - "$f" <<'PY'
          import json, sys
          d = json.load(open('r.json'))
          up = [f"{a.get('name')}({a.get('size')}B,id={a.get('id')})" for a in d.get('assets') or [] if a.get('type') != 'source']
          print(f"  {sys.argv[1]} 登记结果：{up or '（无）'}")
          PY
          done
